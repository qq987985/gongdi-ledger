# 发版工作流：镜像与 Windows 包。
# 模板 ci/docker.workflow.yml 与生效文件 .github/workflows/docker.yml 必须同一提交一起改。
# quality 在本次触发的同一提交上通过类型、回归与 Excel 往返检查后，才允许发布。
# image/windows 分别从源码构建，不使用仓库中的旧 app/。
# main 只发布镜像；v* tag 或手动触发才生成 Windows Release。
# 推送权限以当前凭据为准；没有 workflow 权限时见 ci/README.md 的网页更新路径。

name: docker
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: 安装依赖（严格按 lockfile）
        run: pnpm install --frozen-lockfile
      - name: 类型检查
        run: pnpm run typecheck
      - name: 回归测试
        run: pnpm test
      - name: Excel 往返对拍
        run: pnpm run test:roundtrip

  image:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: 安装依赖（严格按 lockfile）
        run: pnpm install --frozen-lockfile
      - name: 从源码构建 app/（不信任仓库里的产物）
        run: pnpm run build
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  windows:
    needs: quality
    runs-on: ubuntu-latest
    # ★ 发版守卫（C4④）：只有当次推送是 v* tag，或网页手动触发（workflow_dispatch）才打包 + 发 Release。
    #   没有这一行时，推 main（哪怕只改了一段文档）也会移动一次 Release —— 用户侧看到「有新版本」，CI 白跑。
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: 安装依赖（严格按 lockfile）
        run: pnpm install --frozen-lockfile
      - name: 从源码构建 app/（win/pack.sh 拷的就是它）
        run: pnpm run build
      - name: version
        id: ver
        run: |
          VER=$(head -n1 VERSION.txt | awk '{print $1}' | tr -d '[:space:]')
          # 打 tag 时以 tag 名为准（v1.8.14 → 1.8.14），避免 tag 与 VERSION.txt 不一致时发到别的 tag 上
          TAG="${{ github.ref_name }}"
          case "$TAG" in v*) VER="${TAG#v}";; esac
          [ -n "$VER" ] || VER=latest
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
      - name: pack
        run: bash win/pack.sh
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.ver }}
          name: 工地台账 ${{ steps.ver.outputs.ver }} Windows
          body_path: VERSION.txt
          files: gongdi-windows.zip
          make_latest: true
