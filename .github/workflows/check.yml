# 质量闸门（CI）：类型检查 / 回归测试 / Excel 往返对拍 / 构建产物不漂移
#
# 触发：push 到 main、以及任何 PR。
# 本机等价命令（提交前建议先跑一遍）：pnpm run check
#
# 说明：
#   - 测试直接跑 .ts 源码（Node 内置类型擦除），Node 需 ≥ 22.18；这里用 24，与开发者本机一致。
#   - pnpm 版本与开发者一致（12），否则 --frozen-lockfile 可能因 lockfile 版本差异失败。
#   - 最后一步只做「确定性检查」（版本号一致 + 产物关键文件存在）：
#     不同操作系统 / Node 版本构建出的哈希必然不同，字节级比对不能当失败，只作提示。

name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖（严格按 lockfile）
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm run typecheck

      - name: 回归测试
        run: pnpm test

      - name: Excel 往返对拍（导出→导入，70 用例）
        run: pnpm run test:roundtrip

      - name: 构建产物不漂移（确定性检查）
        run: |
          pnpm run build
          APP_VER=$(head -n1 app/VERSION.txt | tr -d '[:space:]')
          SRC_VER=$(head -n1 VERSION.txt | tr -d '[:space:]')
          if [ "$APP_VER" != "$SRC_VER" ]; then
            echo "::error::app/VERSION.txt=$APP_VER 与 VERSION.txt=$SRC_VER 不一致——请本地跑 pnpm run build，把 app/ 一起提交"
            exit 1
          fi
          for f in app/server/index.mjs app/server/server.js app/VERSION.txt; do
            [ -s "$f" ] || { echo "::error::构建产物缺少或为空：$f"; exit 1; }
          done
          if ! git diff --quiet -- app/; then
            echo "::warning::app/ 与 CI 现场构建存在字节差异（多为跨环境哈希差异，不影响功能）："
            git diff --stat -- app/
          fi
