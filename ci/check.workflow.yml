# 质量闸门：类型检查 / 测试 / 构建产物同步
#
# ⚠️ 为什么放在这里而不是 .github/workflows/：
#   开发规范 §2 规定不要在本地改工作流文件——推送 .github/workflows 下的文件需要
#   token 带 workflow 权限，权限不够时 GitHub 会直接拒绝整次推送。
#
# 安装（一次性，30 秒）：
#   GitHub 仓库 → Actions → New workflow → set up a workflow yourself，
#   把本文件内容整段粘进去，文件名填 check.yml，提交。
#   装好之后本文件可以删掉（或留着当备份）。
#
# 说明：
#   - node 22.18+ 才默认支持 TypeScript 类型擦除，测试是直接跑 .ts 源码的，别降到更低的 Node。
#   - pnpm 版本要和开发者本机一致（本机 12.x），否则 --frozen-lockfile 可能因 lockfile 版本差异失败。
#   - 「产物必须与源码同步」这条如果误报（比如不同操作系统下产物有细微差异），
#     可以先把 `exit 1` 去掉只留警告，但不要直接删掉这一步。

name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm run typecheck

      - name: 回归测试
        run: pnpm test

      - name: 构建产物必须与源码同步
        run: |
          pnpm run build
          if ! git diff --quiet -- app/; then
            echo "::error::app/ 与 src/ 不同步——请本地跑 pnpm run build，把 app/ 一起提交"
            git diff --stat -- app/
            exit 1
          fi
