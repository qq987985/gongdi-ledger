# 本机构建专用 compose，由「一键部署.sh」调用。
# 用法：docker compose -f docker-compose.build.yml up -d --build
# docker.sock 给软件里「检查更新 / 更新」用；点更新后会改拉 GitHub 镜像。
services:
  attendance:
    build: .
    image: gongdi-ledger:1.2.19
    container_name: attendance-app
    restart: unless-stopped
    ports:
      - "8501:8080"
    volumes:
      - /vol1/1000/docker/attendance/data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DATA_DIR: /data
      PHOTO_DIR: /data/photos
      PHOTO_ID_DIR: /data/photos/id
      PHOTO_BANK_DIR: /data/photos/bank
      PHOTO_IC_DIR: /data/photos/ic
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "8080"
      HOST: 0.0.0.0
      PORT: "8080"
      GONGDI_IMAGE: ghcr.1ms.run/qq987985/gongdi-ledger:latest
