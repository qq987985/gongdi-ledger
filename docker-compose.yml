# 国内环境默认用此文件，镜像走 ghcr.1ms.run 加速。
# 如需 GitHub 官方源，用 docker-compose.ghcr.yml。
# 只挂 data，不要挂 VERSION.txt。
# docker.sock 给软件里「检查更新 / 更新」用，台账仍只在 data。
services:
  attendance:
    image: ghcr.1ms.run/qq987985/gongdi-ledger:latest
    container_name: attendance-app
    restart: unless-stopped
    ports:
      - "8501:8080"
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DATA_DIR: /data
      PHOTO_DIR: /data/photos
      PHOTO_ID_DIR: /data/photos/id
      PHOTO_BANK_DIR: /data/photos/bank
      PHOTO_IC_DIR: /data/photos/ic
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "8080"
      HOST: 0.0.0.0
      PORT: "8080"
      GONGDI_IMAGE: ghcr.1ms.run/qq987985/gongdi-ledger:latest
