# 从 GitHub 官方镜像源拉取时用：
#   docker compose -f docker-compose.yml pull
#   docker compose -f docker-compose.yml up -d
#
# 国内网络建议改用 docker-compose.github.yml（ghcr.1ms.run 镜像加速）。
# 前提：Actions 已成功，Packages 里 gongdi-ledger 为 Public。
# 只挂 data，不要挂 VERSION.txt。
# docker.sock 给软件里「检查更新 / 更新」用，台账仍只在 data。
services:
  attendance:
    image: ghcr.io/qq987985/gongdi-ledger:latest
    container_name: attendance-app
    restart: unless-stopped
    ports:
      - "8501:8080"
    volumes:
      - /vol1/1000/docker/attendance/data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DATA_DIR: /data
      PHOTO_DIR: /data/photos
      PHOTO_ID_DIR: /data/photos/id
      PHOTO_BANK_DIR: /data/photos/bank
      PHOTO_IC_DIR: /data/photos/ic
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "8080"
      HOST: 0.0.0.0
      PORT: "8080"
      GONGDI_IMAGE: ghcr.io/qq987985/gongdi-ledger:latest
